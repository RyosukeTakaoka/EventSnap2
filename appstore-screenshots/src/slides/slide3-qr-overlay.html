<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 3 — QR Overlay</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="slide">
    <span class="deco star" style="top:66px; left:26px; font-size:18px; transform:rotate(-14deg);">✦</span>
    <span class="deco star" style="top:130px; right:22px; font-size:22px; transform:rotate(8deg);">✦</span>
    <span class="deco heart" style="bottom:145px; right:26px; font-size:18px; transform:rotate(-10deg);">♥</span>
    <span class="deco heart" style="bottom:100px; left:24px; font-size:14px; transform:rotate(10deg);">♥</span>

    <div class="slide-copy">
      <h1>QRをかざすだけ。<br>招待もアプリの検索もいらない。</h1>
    </div>

    <div class="phone-frame-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
          <img src="../../public/screenshots/uploaded/qr-overlay.png" alt="QR invite overlay between two phones">
        </div>
      </div>
    </div>

    <div class="slide-stats">
      <span class="stat">スキャンで即参加</span>
      <span class="dot"></span>
      <span class="stat">アプリ不要で招待</span>
    </div>
  </div>
</body>
</html>
