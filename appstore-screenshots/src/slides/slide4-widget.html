<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 4 — Widget</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="slide">
    <span class="deco star" style="top:72px; right:30px; font-size:20px; transform:rotate(10deg);">✦</span>
    <span class="deco heart" style="top:140px; left:20px; font-size:16px; transform:rotate(-12deg);">♥</span>
    <span class="deco star" style="bottom:150px; left:30px; font-size:14px; transform:rotate(-8deg);">✦</span>
    <span class="deco heart" style="bottom:110px; right:22px; font-size:18px; transform:rotate(14deg);">♥</span>

    <div class="slide-copy">
      <h1>開かなくても、<br>思い出はそこにある。</h1>
    </div>

    <div class="phone-frame-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
          <img src="../../public/screenshots/uploaded/widget.png" alt="EventSnap home screen widget">
        </div>
      </div>
    </div>

    <div class="slide-stats">
      <span class="stat">ホーム画面ウィジェット</span>
      <span class="dot"></span>
      <span class="stat">自動で更新</span>
    </div>
  </div>
</body>
</html>
