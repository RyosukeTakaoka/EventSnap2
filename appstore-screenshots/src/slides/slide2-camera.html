<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 2 — Camera</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="slide">
    <span class="deco star" style="top:70px; right:26px; font-size:20px; transform:rotate(14deg);">✦</span>
    <span class="deco heart" style="top:150px; left:22px; font-size:18px; transform:rotate(-10deg);">♥</span>
    <span class="deco star" style="bottom:160px; right:30px; font-size:14px; transform:rotate(-6deg);">✦</span>
    <span class="deco heart" style="bottom:110px; left:28px; font-size:16px; transform:rotate(12deg);">♥</span>

    <div class="slide-copy">
      <h1>撮った瞬間、<br>もう全員に届いてる。</h1>
    </div>

    <div class="phone-frame-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
          <img src="../../public/screenshots/uploaded/camera.png" alt="EventSnap camera screen">
        </div>
      </div>
    </div>

    <div class="slide-stats">
      <span class="stat">リアルタイム共有</span>
      <span class="dot"></span>
      <span class="stat">ワンタップ撮影</span>
    </div>
  </div>
</body>
</html>
