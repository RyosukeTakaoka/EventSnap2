<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 1 — Event Reel</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="slide">
    <span class="deco star" style="top:64px; left:24px; font-size:22px; transform:rotate(-12deg);">✦</span>
    <span class="deco star" style="top:120px; right:28px; font-size:16px; transform:rotate(10deg);">✦</span>
    <span class="deco heart" style="bottom:150px; left:20px; font-size:20px; transform:rotate(-8deg);">♥</span>
    <span class="deco heart" style="bottom:120px; right:24px; font-size:16px; transform:rotate(14deg);">♥</span>
    <span class="deco star" style="top:210px; left:44px; font-size:12px;">✦</span>

    <div class="slide-copy">
      <h1>みんなの写真が、<br>ひとつになる。</h1>
    </div>

    <div class="phone-frame-wrap">
      <div class="phone-frame">
        <div class="notch"></div>
        <div class="screen">
          <img src="../../public/screenshots/uploaded/event-reel.png" alt="Event reel with photos">
        </div>
      </div>
    </div>

    <div class="slide-stats">
      <span class="stat">12 PEOPLE</span>
      <span class="dot"></span>
      <span class="stat">128 PHOTOS</span>
    </div>
  </div>
</body>
</html>
